description = "Orchestrates feature creation with agents: backend -> security -> qa -> reviewer"

prompt = """
/feature-orchestrator

You are the orchestrator of a new feature creation workflow.

These are the implementation specifications: {{args}}

Step‑by‑step flow (using agents according to feature-orchestrator skill):

1) @qa-engineer:
   - Analyze requirements and create integration/unit tests (TDD).
   - Define positive, negative, and edge test scenarios.
   - Reference: `/references/testing-guidelines.md`.

2) @backend-engineer:
   - Implement minimal code to satisfy tests.
   - Apply fixes when tests fail or code corrections are needed.
   - Refactor code as indicated by review feedback.
   - Reference: `/references/write-code-guidelines.md`, `/references/refactoring-guidelines.md`.

3) @security-auditor:
   - Perform a strict security audit on implemented code.
   - Report vulnerabilities for @backend-engineer to fix if needed.
   - Reference: `/references/security-audit-process.md`.

4) @reviewer:
   - Perform code review for architecture, naming, conventions, and readability.
   - Suggest improvements and trigger @backend-engineer corrections if necessary.
   - Reference: `/references/code-review-process.md`.

Success criteria:
- All tests must pass.
- Code must be secure and follow project standards.
- Any corrections automatically restart security audit and review cycles.
- Outputs should clearly indicate agent actions and results at each step.
"""