# Security Configuration
stockfy.security.jwt.secret=${JWT_SECRET}
stockfy.security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
stockfy.security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}
stockfy.security.cookies.access-token-max-age=${ACCESS_TOKEN_COOKIE_MAX_AGE:15m}
stockfy.security.cookies.refresh-token-max-age=${REFRESH_TOKEN_COOKIE_MAX_AGE:7d}
stockfy.security.hmac.secret=${SECURITY_HMAC_SECRET:${RESET_CODE_HASH_SECRET}}
stockfy.users.password-reset.code-expiration=${RESET_CODE_EXPIRATION:30m}
stockfy.users.rate-limit.default-policy=${USERS_RATE_LIMIT_DEFAULT_POLICY:general}
stockfy.users.rate-limit.policies.general.capacity=${USERS_RATE_LIMIT_GENERAL_CAPACITY:10}
stockfy.users.rate-limit.policies.general.refill-tokens=${USERS_RATE_LIMIT_GENERAL_REFILL_TOKENS:10}
stockfy.users.rate-limit.policies.general.refill-period=${USERS_RATE_LIMIT_GENERAL_REFILL_PERIOD:1m}
stockfy.users.rate-limit.policies.general.write-body=${USERS_RATE_LIMIT_GENERAL_WRITE_BODY:true}
stockfy.users.rate-limit.policies.login.capacity=${USERS_RATE_LIMIT_LOGIN_CAPACITY:5}
stockfy.users.rate-limit.policies.login.refill-tokens=${USERS_RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
stockfy.users.rate-limit.policies.login.refill-period=${USERS_RATE_LIMIT_LOGIN_REFILL_PERIOD:1m}
stockfy.users.rate-limit.policies.login.write-body=${USERS_RATE_LIMIT_LOGIN_WRITE_BODY:true}
stockfy.users.rate-limit.policies.password.capacity=${USERS_RATE_LIMIT_PASSWORD_CAPACITY:5}
stockfy.users.rate-limit.policies.password.refill-tokens=${USERS_RATE_LIMIT_PASSWORD_REFILL_TOKENS:5}
stockfy.users.rate-limit.policies.password.refill-period=${USERS_RATE_LIMIT_PASSWORD_REFILL_PERIOD:1m}
stockfy.users.rate-limit.policies.password.write-body=${USERS_RATE_LIMIT_PASSWORD_WRITE_BODY:true}
stockfy.users.rate-limit.policies.refresh.capacity=${USERS_RATE_LIMIT_REFRESH_CAPACITY:5}
stockfy.users.rate-limit.policies.refresh.refill-tokens=${USERS_RATE_LIMIT_REFRESH_REFILL_TOKENS:5}
stockfy.users.rate-limit.policies.refresh.refill-period=${USERS_RATE_LIMIT_REFRESH_REFILL_PERIOD:1m}
stockfy.users.rate-limit.policies.refresh.block-capacity=${USERS_RATE_LIMIT_REFRESH_BLOCK_CAPACITY:15}
stockfy.users.rate-limit.policies.refresh.block-refill-period=${USERS_RATE_LIMIT_REFRESH_BLOCK_REFILL_PERIOD:1m}
stockfy.users.rate-limit.policies.refresh.write-body=${USERS_RATE_LIMIT_REFRESH_WRITE_BODY:true}
stockfy.users.rate-limit.policies.logout.capacity=${USERS_RATE_LIMIT_LOGOUT_CAPACITY:10}
stockfy.users.rate-limit.policies.logout.refill-tokens=${USERS_RATE_LIMIT_LOGOUT_REFILL_TOKENS:10}
stockfy.users.rate-limit.policies.logout.refill-period=${USERS_RATE_LIMIT_LOGOUT_REFILL_PERIOD:1m}
stockfy.users.rate-limit.policies.logout.write-body=${USERS_RATE_LIMIT_LOGOUT_WRITE_BODY:false}
stockfy.users.rate-limit.endpoints[0].method=POST
stockfy.users.rate-limit.endpoints[0].path=/api/v1/auth/sessions
stockfy.users.rate-limit.endpoints[0].policy=login
stockfy.users.rate-limit.endpoints[1].method=POST
stockfy.users.rate-limit.endpoints[1].path=/api/v1/auth/sessions/refresh
stockfy.users.rate-limit.endpoints[1].policy=refresh
stockfy.users.rate-limit.endpoints[2].method=DELETE
stockfy.users.rate-limit.endpoints[2].path=/api/v1/auth/sessions/current
stockfy.users.rate-limit.endpoints[2].policy=logout
stockfy.users.rate-limit.endpoints[3].method=PATCH
stockfy.users.rate-limit.endpoints[3].path=/api/v1/users/password
stockfy.users.rate-limit.endpoints[3].policy=password

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# JPA Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.error.include-stacktrace=never
